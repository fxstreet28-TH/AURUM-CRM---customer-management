<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · AURUM CRM</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { 'aurum-bg': '#FAFAFA', 'aurum-gold': '#D4AF37', 'aurum-ink': '#111827' },
      fontFamily: { display: ['"Plus Jakarta Sans"','Inter','sans-serif'], sans: ['Inter','sans-serif'] }
    }}};
  </script>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="min-h-screen bg-aurum-bg flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="font-display text-3xl font-bold tracking-tight">
        <span class="text-aurum-gold">AURUM</span> CRM
      </div>
      <p class="text-sm text-gray-500 mt-1">Admin console for AURUM AI users</p>
    </div>

    <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-8">
      <h1 class="font-display text-xl font-semibold text-aurum-ink">Sign in</h1>
      <p class="text-sm text-gray-500 mt-1">Use your admin email and password.</p>

      <form id="login-form" class="mt-6 space-y-4" autocomplete="on">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1" for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required
                 class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-aurum-ink placeholder-gray-400 focus-aurum" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6"
                 class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-aurum-ink placeholder-gray-400 focus-aurum" />
        </div>

        <div id="login-msg" class="hidden text-sm rounded-lg px-3 py-2"></div>

        <button type="submit" id="login-submit"
                class="w-full bg-aurum-gold text-aurum-ink font-semibold rounded-lg px-4 py-2.5 text-sm hover:brightness-95 disabled:opacity-60 disabled:cursor-not-allowed">
          Sign in
        </button>
      </form>

      <p class="text-xs text-gray-400 mt-6 text-center">
        Problems signing in? Contact your super admin.
      </p>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      &copy; <span id="year"></span> AURUM AI · Admin
    </p>
  </div>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/permissions.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (async () => {
      // If already signed in, bounce straight to dashboard.
      const sess = await AurumAuth.currentSession();
      if (sess) {
        const p = await AurumAuth.currentProfile(sess);
        if (p && p.status !== "suspended") {
          location.replace(p.must_change_pw ? "settings.html?force_pw=1" : "dashboard.html");
          return;
        }
      }

      // Surface reason query param (e.g. ?m=suspended).
      const reason = new URLSearchParams(location.search).get("m");
      if (reason) {
        const msg = {
          suspended: "Your account has been suspended.",
          noprofile: "No profile found for this account.",
          signin:    "Please sign in to continue.",
        }[reason];
        if (msg) showMessage(msg, "warn");
      }

      const form = document.getElementById("login-form");
      const btn  = document.getElementById("login-submit");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email    = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        btn.disabled = true; btn.textContent = "Signing in…";
        try {
          await AurumAuth.signIn(email, password);
          const s = await AurumAuth.currentSession();
          const p = await AurumAuth.currentProfile(s);
          if (!p)                        throw new Error("No profile found. Contact super admin.");
          if (p.status === "suspended")  { await sb.auth.signOut(); throw new Error("This account is suspended."); }
          AurumAuth.log("auth.sign_in");
          location.replace(p.must_change_pw ? "settings.html?force_pw=1" : "dashboard.html");
        } catch (err) {
          showMessage(err.message || "Invalid email or password.", "error");
          btn.disabled = false; btn.textContent = "Sign in";
        }
      });

      function showMessage(text, type) {
        const el = document.getElementById("login-msg");
        const cls = type === "error" ? "bg-rose-50 text-rose-700 ring-rose-600/20"
                  : type === "warn"  ? "bg-amber-50 text-amber-800 ring-amber-600/20"
                  :                    "bg-gray-50 text-gray-700 ring-gray-500/20";
        el.className = `text-sm rounded-lg px-3 py-2 ring-1 ring-inset ${cls}`;
        el.textContent = text;
        el.classList.remove("hidden");
      }
    })();
  </script>
</body>
</html>
